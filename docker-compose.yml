services:
  postgres:
    image: postgres:16-alpine
    container_name: prospect-poc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospect
      POSTGRES_PASSWORD: prospect
      POSTGRES_DB: prospect_poc
    ports:
      # Host 5433 -> container 5432. Avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - prospect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect -d prospect_poc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prospect_pgdata:
